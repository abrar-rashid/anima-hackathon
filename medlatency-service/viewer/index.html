<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MedLatency · Evidence into action</title>
<style>
:root{--ink:#172d3c;--muted:#566a76;--paper:#f3f5f3;--line:#d8e1df;--teal:#087b70;--amber:#875514}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}header{background:#152f3d;color:white;padding:22px 5%;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-size:25px;font-weight:730;letter-spacing:-1px}.brand i{color:#79d8c1;font-style:normal}header small{color:#bbd0d7}.shell{max-width:1440px;margin:auto;padding:32px 5%}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:12px;font-weight:750;color:var(--teal)}h1{font-size:38px;line-height:1.16;letter-spacing:-1.2px;margin:8px 0 15px}h2{font-size:23px;letter-spacing:-.4px}h3{margin:5px 0 10px;font-size:22px}p{margin:8px 0 15px}.muted,small{color:var(--muted)}select,button,input,textarea{font:inherit;border:1px solid #b9c9c9;border-radius:7px;padding:9px 12px;background:white;color:var(--ink)}button{cursor:pointer}button:hover{background:#e5efea}button.primary{background:var(--teal);color:white;border-color:var(--teal)}select{max-width:100%}.hero{display:flex;justify-content:space-between;gap:25px;align-items:start}.badges{display:flex;gap:8px;flex-wrap:wrap}.badge{display:inline-block;padding:4px 10px;border:1px solid var(--line);border-radius:4px;font-size:12px;letter-spacing:.4px;background:white;font-weight:700}.honesty{background:#e9f0e9;border-left:4px solid var(--teal);padding:12px 17px;margin:22px 0}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:25px 0 10px}.stat{padding:16px;background:white;border:1px solid var(--line);border-radius:9px}.stat strong{display:block;font-size:32px;line-height:1.3}.stat span{font-size:13px;color:var(--muted)}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:28px 0 15px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{border:1px solid var(--line);background:white;border-radius:10px;padding:23px;min-width:0}.card:only-child{grid-column:1/-1;max-width:980px}.card.fulfilled{border-top:4px solid var(--teal)}.card.unresolved{border-top:4px solid #c09850}.card blockquote{font-size:15px;background:#f3f6f5;padding:13px 15px;margin:18px 0;border-left:3px solid #b2c6c4}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.k{font-size:12px;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);display:block}.next{padding:12px 0;border-top:1px solid var(--line);margin-top:15px;font-weight:650}.state{font-size:14px}.warning{color:#875514}.stage{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}.stage span:last-child{text-align:right}details{margin-top:12px}summary{cursor:pointer;font-weight:650;font-size:14px;padding:7px 0}pre{white-space:pre-wrap;word-break:break-word;font-size:12px;background:#f2f5f4;padding:12px;max-height:350px;overflow:auto}code{font-size:12px;word-break:break-all}.source{font-size:13px;background:#f3f6f5;padding:14px;border-radius:6px;margin:10px 0}.source q{display:block;margin:7px 0}.empty{padding:30px;background:white;border:1px dashed #9ab2b2}.timeline{border-left:2px solid #bdd1cc;padding-left:20px;margin-left:6px}.timeline p{position:relative;padding:7px 0}.timeline p:before{content:'•';position:absolute;left:-27px;color:var(--teal)}.error{color:#9c3531;font-weight:650}#message{min-height:25px}.reviewform{display:grid;gap:8px}.reviewform label{font-size:13px}.reviewform textarea{width:100%;min-height:70px}.footer{margin:40px 0 20px;padding-top:15px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}a{color:var(--teal)}@media(max-width:950px){.stats{grid-template-columns:repeat(3,1fr)}.cards{grid-template-columns:1fr}.hero{display:block}}@media(max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}header{display:block}.shell{padding:22px 5%}h1{font-size:31px}}@media print{header select,.toolbar,.reviewform{display:none}.cards{display:block}.card{break-inside:avoid;margin-bottom:20px}body{background:white}}
</style></head><body>
<header><div><div class="brand">Med<i>Latency</i></div><small>Evidence into action.</small></div><label id="switchLabel">Patient <select id="patientSelect" aria-label="Choose patient"></select></label></header>
<main class="shell"><div id="message" role="status" aria-live="polite"></div><section id="overview"></section><div class="toolbar"><label>Show <select id="filter"><option value="all">All active tasks</option><option value="unresolved">Unresolved outcomes</option><option value="ambiguous">Ambiguous matches</option><option value="mentions">All mentions and subtasks</option></select></label><button id="analyse" class="primary">Run analysis</button><select id="provider" aria-label="Analysis provider"><option value="replay">Authored fixture replay</option><option value="openai">Configured model provider</option></select><a id="export" href="#">Export standalone view ↗</a></div><div id="cards" class="cards"></div><section id="extras"></section><p class="footer">Hackathon demonstration using simulated patients. Source facts, interpretations, template suggestions and human decisions are distinct. No clinical accuracy or delay-reduction claim is made.</p></main>
<script>
const OFFLINE=/*__PATIENT_DATA__*/null;
const $=id=>document.getElementById(id), esc=v=>String(v??'not established').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const formatTime=v=>{if(v===null||v===undefined)return 'not established';let d=new Date(v);return Number.isNaN(d.getTime())?String(v):d.toISOString().replace('T',' ').replace('.000Z',' UTC')};
const pretty=s=>String(s??'not established').replaceAll('_',' ');
const markers={evidenced:'● Evidenced',inferred:'○ Inferred',not_evidenced:'– Not evidenced',explicitly_pending:'⚠ Explicitly pending',conflicting:'⚠ Conflicting',not_applicable:'– Not applicable'};
let packet=null,selected=null,requestVersion=0;
async function api(url,options={}){let r=await fetch(url,options);let b=await r.json();if(!r.ok)throw Error(b.error||'Request failed');return b}
function notify(text,error=false){$('message').textContent=text;$('message').className=error?'error':''}
function refPanel(ref){let r=packet.evidence.find(x=>x.snapshot_id===ref.snapshot_id);return `<div class="source"><q>${esc(ref.quote)}</q><code>${esc(ref.resource_id)} ${esc(ref.pointer)}</code><br><small>Snapshot ${esc(ref.snapshot_id)}<br>Clinical event: ${esc(formatTime(r?.clinical_event_at))} · ${esc(r?.clock)} clock<br>Record created: ${esc(formatTime(r?.record_created_at))} · not a completion timestamp<br>Source status: ${esc(r?.source_status)}</small></div>`}
function candidate(c,t){let evidence=c.observation?refPanel(c.observation.source):`<p>Candidate resource: <code>${esc(c.resource_id)}</code></p>`;return `<details><summary>${c.review_required?'⚠ Review required':'● '+(c.accepted?'Accepted evidence':'Rejected match')} · ${esc(pretty(c.basis))}</summary>${evidence}<p>${esc(c.observation?.explanation||'Candidate only; no validated stage assertion.')}</p><small>${esc([...c.supporting_attributes,...c.conflicting_attributes].join(' · '))}<br>Decision: ${esc(pretty(c.decision_origin))}</small><p><code>Candidate ID: ${esc(c.id)}</code></p></details>`}
function card(t){let r=t.resolution;return `<article class="card ${r.fulfillment==='fulfilled'?'fulfilled':'unresolved'}" data-task="${esc(t.id)}"><div class="badges"><span class="badge">${esc(pretty(t.family))}</span><span class="badge">${esc(t.origin==='inferred'?'INFERRED CANDIDATE':pretty(t.intent))}</span>${t.parent_id?'<span class="badge">SUBTASK</span>':''}</div><h3>${esc(t.label)}</h3><p class="muted">${esc(t.outcome)}</p><div class="two"><div><span class="k">Work started</span><strong>${t.work_started?'● Evidence of progress':'– Not established'}</strong><div class="muted state">${esc(pretty(r.progress))}</div></div><div><span class="k">Outcome</span><strong>${esc(pretty(r.fulfillment))}</strong><div class="state">${esc(markers[r.assessment]||r.assessment)}</div></div></div><p><small>Responsible: ${esc(t.responsible)} · ${esc(pretty(r.lifecycle))}${t.overdue?' · ⚠ Supported deadline passed':''}</small></p>${t.condition?`<p class="warning">Condition: ${esc(t.condition)}</p>`:''}${t.preferences.length?`<p><small>Preferences: ${esc(t.preferences.join(' · '))}</small></p>`:''}<blockquote>${esc(t.source.quote)}</blockquote><div class="next">Next: ${esc(r.next_step)}</div><details><summary>Stages, subtasks & dependencies</summary><small>Possible stages are suggestions. A later stage does not prove earlier stages occurred. Criterion: ${esc(t.fulfillment_rule)} required endpoints.</small>${t.stages.map(s=>`<div class="stage"><span>${esc(pretty(s.stage))}<br><small>${s.required?'Required endpoint · interpretation':'○ Template suggestion · optional'}</small></span><span>${esc(markers[s.assessment])}</span></div>`).join('')}${t.edges.map(e=>`<p class="source">${esc(packet.tasks.find(x=>x.id===e.from_id)?.label)} → ${esc(packet.tasks.find(x=>x.id===e.to_id)?.label)}<br><small>${esc(e.kind)} · ${esc(e.origin)}${e.condition?' · '+esc(e.condition):''}</small></p>`).join('')}${packet.tasks.filter(x=>x.parent_id===t.id).map(x=>`<div class="source"><strong>${esc(x.label)}</strong><br>${esc(pretty(x.resolution.fulfillment))} · ${esc(x.resolution.next_step)}</div>`).join('')}</details><details><summary>Source evidence & candidate matches (${t.candidates.length})</summary>${refPanel(t.source)}${t.candidates.map(c=>candidate(c,t)).join('')}${t.uncertainties.map(x=>`<p class="warning">⚠ ${esc(x)}</p>`).join('')}</details>${t.review_flags.map(x=>`<p class="warning">⚠ ${esc(x)}</p>`).join('')}<details><summary>Local human review</summary><small>Append-only decisions affect MedLatency only.</small>${OFFLINE?'<p>Standalone export: review decisions are read-only.</p>':`<form class="reviewform" data-task="${esc(t.id)}"><label>Decision <select name="operation"><option value="dispute">Dispute interpretation</option><option value="correct">Correct fields</option><option value="accept_match">Accept candidate</option><option value="reject_match">Reject candidate</option><option value="merge">Merge another mention</option><option value="split">Split task</option></select></label><input name="reviewer" placeholder="Reviewer name" required aria-label="Reviewer name"><textarea name="explanation" placeholder="Explain this decision" required aria-label="Review explanation"></textarea><label>Payload JSON (see examples below)<textarea name="payload" aria-label="Review payload">{}</textarea></label><small>Correct: {"responsible":"GP team"}<br>Candidate: {"candidate_id":"match_…"}<br>Merge: {"other_task_id":"task_…"}<br>Split: {"children":[{"label":"Action A","outcome":"Outcome A","required_stages":["requested"]},{"label":"Action B","outcome":"Outcome B","required_stages":["received"]}]}</small><button>Save review</button><code>Task ID: ${esc(t.id)}</code></form>`}</details></article>`}
function render(){let o=packet.overview,c=packet.summary;$('overview').innerHTML=`<div class="hero"><div><div class="eyebrow">Patient follow-up / evidence review</div><h1>${esc(o.patient.display_name)}</h1><p class="muted">${esc(o.patient.id)} · Clinical as-of ${esc(formatTime(o.clinical_as_of))}</p></div><div class="badges"><span class="badge">${esc(o.dataset.mode.toUpperCase())} EVIDENCE</span><span class="badge">${esc(pretty(o.analysis_mode).toUpperCase())}</span></div></div><div class="honesty"><strong>${esc(o.dataset.label)}</strong><br><small>${esc(o.context.filter(x=>x!==o.dataset.label).join(' · '))}</small></div><div class="stats">${[['tasks_identified','Parent tasks'],['with_progress','With progress'],['fulfilled','Fulfilled outcomes'],['explicitly_outstanding','Explicitly outstanding'],['unknown_fulfillment','Unknown fulfillment'],['ambiguous_matches','Candidate reviews']].map(([k,l])=>`<div class="stat"><strong>${c[k]}</strong><span>${l}</span></div>`).join('')}</div><p class="muted"><small>${c.tasks_identified} documented parent tasks · ${c.inferred_candidates||0} inferred candidates · ${c.subtasks} subtasks</small></p><details><summary>Counting rules & coverage · ${c.subtasks} subtasks</summary><p class="muted">${esc(packet.counting_rules)}</p><ul>${o.coverage.limitations.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></details>`;
let mode=$('filter').value;let tasks=packet.tasks.filter(t=>mode==='mentions'||mode==='ambiguous'&&t.candidates.some(c=>c.review_required)||mode!=='ambiguous'&&t.active&&(!t.parent_id)&&(mode!=='unresolved'||t.resolution.fulfillment!=='fulfilled'));
$('cards').innerHTML=tasks.map(card).join('')||'<div class="empty">No tasks in this view. Imported evidence remains available below; run an analysis to extract tasks.</div>';
$('extras').innerHTML=`<details><summary>Demo highlights</summary>${packet.demo_highlights.map(h=>`<p><strong>${esc(h.label)}</strong><br>${esc(h.why)}</p>`).join('')}</details><h2>Evidence timeline</h2><small>Events retain their clock domain. Metadata is hidden by default; record creation is never clinical completion.</small><div class="timeline">${packet.timeline.filter(e=>!e.hidden_by_default).map(e=>`<p><small>${esc(formatTime(e.time||e.occurred_at))} · ${esc(e.clock)} · ${esc(e.kind||'source event')}</small><br>${esc(e.label||e.type||e.resource_id)}</p>`).join('')}</div><details><summary>Record metadata timeline</summary><pre>${esc(JSON.stringify(packet.timeline.filter(e=>e.hidden_by_default),null,2))}</pre></details><details><summary>Inspect all source snapshots (${packet.evidence.length})</summary>${packet.evidence.map(r=>`<details><summary>${esc(r.title)} · source status ${esc(r.source_status)}</summary><pre>${esc(JSON.stringify(r,null,2))}</pre></details>`).join('')}</details><details><summary>Analysis provenance & human decisions</summary><pre>${esc(JSON.stringify(packet.analysis,null,2))}</pre></details>`;
$('export').href='/api/patients/'+encodeURIComponent(o.patient.id)+'/export';$('export').download=o.patient.id+'.html';
}
async function load(pid){selected=pid;const version=++requestVersion;notify('Loading patient…');try{let result=await api('/api/patients/'+encodeURIComponent(pid)+'/overview');if(version!==requestVersion)return;packet=result;render();notify('')}catch(e){if(version===requestVersion)notify(e.message,true)}}
$('patientSelect').onchange=e=>load(e.target.value);$('filter').onchange=()=>{if(packet)render()};
$('cards').addEventListener('submit',async e=>{if(!e.target.matches('.reviewform'))return;e.preventDefault();let form=new FormData(e.target);try{let decision={task_id:e.target.dataset.task,operation:form.get('operation'),reviewer:form.get('reviewer'),explanation:form.get('explanation'),payload:JSON.parse(form.get('payload'))};await api('/api/patients/'+encodeURIComponent(selected)+'/reviews',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(decision)});await load(selected);notify('Review saved locally. Original interpretation retained.')}catch(error){notify(error.message,true)}});
$('analyse').onclick=async()=>{const pid=selected;try{$('analyse').disabled=true;let job=await api('/api/patients/'+encodeURIComponent(pid)+'/analyses',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({provider:$('provider').value})});let state;do{state=await api('/api/jobs/'+job.job_id);notify('Analysis '+state.status+' · '+pid);if(['queued','running'].includes(state.status))await new Promise(r=>setTimeout(r,800))}while(['queued','running'].includes(state.status));if(state.status==='failed')throw Error(state.error);if(selected===pid)await load(pid)}catch(e){notify(e.message,true)}finally{$('analyse').disabled=false}};
(async()=>{if(OFFLINE){packet=OFFLINE;selected=packet.overview.patient.id;$('switchLabel').textContent='Standalone patient export';$('analyse').hidden=true;$('provider').hidden=true;$('export').hidden=true;render();return}try{let list=await api('/api/patients');$('patientSelect').innerHTML=list.patients.map(p=>`<option value="${esc(p.id)}">${esc(p.display_name)} · ${esc(p.dataset_mode)} · ${esc(p.readiness)}</option>`).join('');if(list.patients.length)await load(list.patients[0].id);else notify('No patients imported. Run python scripts/demo.py or POST a bundle to /api/bundles.')}catch(e){notify(e.message,true)}})();
</script></body></html>
